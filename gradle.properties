# ---------------------------------------------------------------------------
# Gradle 运行参数
# ---------------------------------------------------------------------------
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

# ---------------------------------------------------------------------------
# 构建目标：1.20.1 或 1.20.4
#   对应的 yarn / loader / fabric-api 全部写在 build.gradle 的 MC_PROFILES 表里，
#   这里只留一个开关，避免手动改三处版本号导致错配。
#   ！命令行覆盖优先于本文件：gradle build -Pmc_version=1.20.1
# ---------------------------------------------------------------------------
mc_version=1.20.4

# ---------------------------------------------------------------------------
# 模组自身信息
# ---------------------------------------------------------------------------
mod_version=1.0.0
maven_group=cn.blockforge
archives_base_name=tidin_ctrl_ctrl_ctrl_ctr
